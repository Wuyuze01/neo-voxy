name: manual-artifact-1.20.1

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build 1.20.1 Forge client
        shell: bash
        run: |
          set -euo pipefail
          chmod +x editions/forge-1.20.1-client/gradlew
          cd editions/forge-1.20.1-client
          ./gradlew clean build --no-daemon --console=plain

      - name: Verify exactly one release jar
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(
            find editions/forge-1.20.1-client/build/libs -maxdepth 1 -type f \
              -name 'neo-voxy-*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-dev.jar' \
              ! -name '*-unoptimized.jar' \
              -print | sort
          )
          printf 'found %d release jar(s):\n' "${#jars[@]}"
          printf '  %s\n' "${jars[@]}"
          if (( ${#jars[@]} != 1 )); then
            echo "Expected exactly one release jar" >&2
            find editions/forge-1.20.1-client/build -type f -name '*.jar' -print >&2
            exit 1
          fi
          echo "RELEASE_JAR=${jars[0]}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: neo-voxy-1.20.1-forge
          path: ${{ env.RELEASE_JAR }}
          if-no-files-found: error
